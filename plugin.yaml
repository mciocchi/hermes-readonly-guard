name: readonly-guard
version: "3.6"
description: Per-session code-enforced posture with three modes — readonly, plan, writable — switched by /readonly, the dashboard API, or the desktop chip; new sessions start at the configurable default, and a writable session returns to readonly after 30 minutes without a message (configurable, 0 disables).
author: mciocchi
license: MIT
homepage: https://github.com/mciocchi/hermes-readonly-guard/
provides_tools: []
provides_hooks:
  - pre_tool_call
  - pre_llm_call

# Settings a user can change in Settings → Plugins (and that the desktop chip writes
# when no chat has a session yet). Declared here so Hermes validates the value and the
# Plugins tab renders a form; `ctx.get_config("default_mode")` reads it.
config_schema:
  default_mode:
    type: str
    choices: [readonly, plan, writable]
    default: readonly
    label: Default mode for new sessions
    description: >-
      The guard's posture for a session that has never been switched. Read-only is the
      restrictive default; plan asks for a plan instead of executing; writable blocks
      nothing. Changing this never touches a session that already has its own setting.
  writable_expiry_minutes:
    type: int
    default: 30
    label: Writable mode expires N minutes after the user's last message
    description: >-
      A session in writable mode goes back to read-only once you have been silent for this
      many minutes, so a forgotten session cannot stay armed. The clock starts at the
      beginning of each of your turns, and a turn already running is never interrupted.
      Set 0 to let writable stay on until you change it.
