# The entry that gets copied into a PR against NousResearch/hermes-agent as
# plugin-catalog/readonly-guard.yaml. It is not read by the plugin loader; it is
# versioned here so `tests/test_packaging.py` can pin its URLs and its capabilities
# block to what register() actually wires, and so the version cannot drift.
#
# The repository is `hermes-readonly-guard`; the catalog KEY below is the manifest name
# (`readonly-guard`), which is what users search and install.
#
# No `requires_hermes`: decided against. An over-tight floor makes the loader skip the
# plugin, and the test suite would not notice.
#
# `sha` is the published commit: it pins the entry, the README the docs render, and the
# card image. A push that changes the code must bump `sha` and the `image:` below, and
# `tests/test_banner.py` fails until both move together.
name: readonly-guard
repo: https://github.com/mciocchi/hermes-readonly-guard
sha: "d2b6317e6bf67f35bb0bbd98c3e508595cfea36b"
subdir: ""
description: >-
  Three-mode, per-session tool guard for Hermes: read-only (writes blocked; inspection
  tools plus single allowlisted read-only shell commands), plan (the same, plus the plan
  markdown), and writable. Switched from the status bar, /readonly or the dashboard API; a
  session that is never switched follows a configurable default (read-only). Disclosure —
  registers a pre_tool_call hook that can block any tool call, and fails closed when the
  hook raises; writes <HERMES_HOME>/readonly-guard.state (session -> mode) and
  plugins.entries.readonly-guard.settings.default_mode; in read-only and plan modes it
  runs single, allowlisted, read-only shell commands through terminal (a speed bump, not a
  sandbox; on Windows those run under Git Bash); no network calls, no environment
  variables, no Python dependencies.
maintainer: mciocchi
tier: community
category: desktop
docs_url: https://github.com/mciocchi/hermes-readonly-guard
image: "https://raw.githubusercontent.com/mciocchi/hermes-readonly-guard/d2b6317e6bf67f35bb0bbd98c3e508595cfea36b/docs/banner.png"
version: "3.6"
platforms: [linux, macos, windows]
capabilities:
  provides_tools: []
  provides_hooks: [pre_tool_call, pre_llm_call]
  provides_middleware: []
  requires_env: []
