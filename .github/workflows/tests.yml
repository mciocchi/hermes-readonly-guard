name: tests

on:
  push:
    branches: [main, windows-compatibility]
  pull_request:

jobs:
  unittest:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The plugin needs no dependencies; the TESTS import yaml and exercise the dashboard
      # half, which imports fastapi (Hermes provides it at runtime). Hermes itself is absent
      # on a runner, which is the point: the suite must pass without the agent checkout.
      - run: pip install pyyaml fastapi httpx
      # Annotations, not just a red X: without an authenticated API token the log is
      # unreadable, and "which test failed on Windows" is the only question this job
      # exists to answer.
      - name: run the suite
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -t tests -v 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          # A public annotation, so "how many tests ran, and how many skipped" is
          # readable without a token — a green tick alone cannot tell this job from one
          # that skipped everything.
          echo "::notice::$(grep -E '^Ran [0-9]+ tests' test-output.txt | tail -1) $(grep -E '^OK|^FAILED' test-output.txt | tail -1)"
          if [ "$status" -ne 0 ]; then
            grep -E "^(FAIL|ERROR):" test-output.txt | head -20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "--- last 40 lines ---"
            tail -40 test-output.txt
          fi
          exit "$status"
